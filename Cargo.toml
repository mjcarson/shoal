[workspace]
resolver = "2"

members = [ 
    "shoal",
    "shoal-core",
    "shoal-derive",
    "shoalctl",
]

[workspace.dependencies]
rkyv = { version = "0.8.10", features = ["uuid-1"] }
gxhash = { version = "3", features = ["deterministic"] }
uuid = { version = "1", features = ["v4"] }
glommio = { path = "../glommio/glommio", version = "0.10"}
tokio = { version = "1", features = ["full"] }
kanal = "0.1.0-pre8"
mimalloc = { version = "0.1.0"}
hotpath = "0.9"

[build]
rustflags = ["-Ctarget-cpu=native"]
