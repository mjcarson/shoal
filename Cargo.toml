[workspace]
resolver = "2"

members = [
    "shoal",
    "shoal-bench",
    "shoal-client",
    "shoal-channel",
    "shoal-client-check",
    "shoal-core",
    "shoal-derive",
    # the schema generic benchmark driver shoaladm bench is built on (F66)
    "shoal-loadgen",
    "shoal-model",
    "shoal-proto",
    "shoal-spike",
    # X10, what a stripe row costs: a schema shaped like the object store's two generated rows, its
    # node program and the spike's own driver (docs/src/object-storage/stripe-row-costs.md)
    "shoal-spike-rows",
    # X3, bytes through the tablet groups: a stripe as a row, its node program and the spike's own
    # driver over shoal-loadgen's (docs/src/object-storage/bytes-through-groups.md)
    "shoal-spike-bytes",
    # X8, one small write three ways: a row, staged to a holder process then committed, and inside
    # the commit; its node program, the holder and the spike's own driver
    # (docs/src/object-storage/small-writes.md)
    "shoal-spike-small",
    "shoal-top",
    # the admin program and the terminal UI, split in F63: shoalctl depends on shoaladm
    "shoaladm",
    "shoalctl",
    # the TMDB dataset as a deployable database: a node program and a loader (F54)
    "examples/tmdb_dataset",
    # a small schema and committed dataset shoaladm bench is tested against (F66)
    "examples/bench_dataset",
]

[workspace.dependencies]
rkyv = { version = "0.8.10", features = ["uuid-1"] }
# the one gxhash in the workspace, and it is a persistence format: `GxHasher::default()` is what
# hashes every partition key, its zero-seeded state is stable within a major, and a row's hash
# decides which partition and tablet it is in. `shoal/tests/partition_keys.rs` freezes eight keys
# to the values 2.3.1 gives them. moving this major re-homes every row ever written, so it is a
# migration and not a version bump - see resolved item 65
gxhash = "2.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
glommio = { path = "../glommio/glommio", version = "0.10"}
tokio = { version = "1", features = ["full"] }
kanal = "0.1.0-pre8"
# pinned here rather than per crate because it is a supertrait bound on the table traits, so a
# schema crate and the crate holding the bound have to agree on it or the impls stop unifying
deepsize2 = "0.1"
mimalloc = { version = "0.1.0"}
hotpath = "0.9"
criterion = { version = "0.7", features = ["html_reports"] }

# note: a [build] table here is silently ignored by cargo. the rustflags that used to sit at
# this spot never took effect, which is why the docs and shoal_looper.sh both passed RUSTFLAGS
# by hand. they now live in .cargo/config.toml, where cargo actually reads them.
