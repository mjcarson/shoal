[book]
title = "Shoal Internals"
description = "Developer documentation for the internals of Shoal: design choices, limitations, TODOs, and known bugs."
authors = ["The Shoal developers"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mjcarson/shoal"
# Themes the generated charts on operations/benchmark-results.md. Those charts are drawn by
# plotters, which emits fixed colours, so they are drawn in sentinel colours that this stylesheet
# maps onto the book's own theme variables. Without it every chart is drawn in raw sentinel red.
additional-css = ["theme/charts.css"]
