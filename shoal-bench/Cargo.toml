[package]
name = "shoal-bench"
version = "0.1.0"
edition = "2024"
description = "Executes Shoal's benchmarks, stores the results with their provenance, compares them against a baseline, and renders the book's benchmark results page"
# there are two binaries here, and `cargo run -p shoal-bench` has to keep meaning the runner. the
# other one is spawned by the runner and by nobody else.
default-run = "shoal-bench"

[lib]
name = "shoal_bench"
path = "src/lib.rs"

# The runner, which plans a capture, judges it and renders the book's page. Never links the engine.
[[bin]]
name = "shoal-bench"
path = "src/main.rs"

# The measured process, which is the only thing here that links `shoal`.
#
# This is a second binary rather than a subcommand of the first because the two instrumented
# layers are built with a feature that changes the code being measured. `hotpath` has to annotate
# a `main`, so running a workload inside the runner would mean rebuilding the tool that is
# currently executing and then reporting its own argument parsing and chart rendering as scopes.
# Building `--bin shoal-workload --features hotpath` leaves `target/release/shoal-bench` alone.
[[bin]]
name = "shoal-workload"
path = "src/workload_main.rs"
required-features = ["workloads"]

# The workloads link `shoal`, and the runner must not.
#
# `workloads` is on by default so that `cargo check --workspace --all-targets` compiles every
# workload against the real engine API - a workload that stops describing the code is then a
# compile error rather than a benchmark that quietly measures nothing. An optional-off feature
# would not be enabled by `--all-targets` and would let them rot silently.
#
# The feature exists at all so `--no-default-features` still builds the runner with no glommio,
# rkyv or mimalloc. That is the half that judges a change, and it has to be buildable while the
# engine is mid-refactor and will not compile. `compare`, `status`, `render` and `promote` need
# nothing from `shoal`; only `list` and `run` do.
[features]
default = ["workloads"]
workloads = [
    "dep:shoal",
    "dep:shoal-core",
    "dep:tokio",
    "dep:kanal",
    "dep:rkyv",
    "dep:deepsize2",
    "dep:uuid",
    "dep:mimalloc",
    "dep:rcgen",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    # a workload's client puts a trace context on the wire, so a captured query is one trace
    # rather than two. this sits in `workloads` rather than in a feature of its own because the
    # three crates above are already unconditional here, and a capture that traced only half of
    # each query would be the one shape nobody wants (F35)
    "shoal/otel",
]
# attribute time to scopes. must forward to `shoal`, which forwards to `shoal-core`, since every
# instrumentation attribute lives there
hotpath = ["workloads", "shoal/hotpath", "dep:hotpath"]
# record where each query spent its time, stage by stage
stage-profile = ["workloads", "shoal/stage-profile"]

# Every dependency below is already resolved in the workspace lockfile, so adding this crate
# downloads nothing. Keep it that way: `cargo tree -p shoal-bench --no-default-features` should
# never introduce a package that some other member did not already pull in, and should never
# mention glommio.
#
# `shoal-top` is the one entry that needed this paragraph amended rather than obeyed. The explorer
# it holds is an egui application, and the workspace lockfile grew by about two hundred and fifty
# packages to resolve it - almost all of them eframe's *native* backend, since the browser half was
# already there behind plotters. What is preserved is the test the paragraph actually names: it is
# entered below with `default-features = false`, which takes the index types and leaves the graphics
# behind, so `cargo tree -p shoal-bench --no-default-features` still mentions no egui and no
# glommio, and the half of this crate that judges a change is still the cheapest build in the tree.
[dependencies]
# The explorer's index types. `default-features = false` is mandatory and is the whole reason the
# types live in that crate rather than this one: with them, this dependency is `serde` structs, and
# without them it would drag egui, winit and wgpu into the runner.
shoal-top = { version = "0.1.0", path = "../shoal-top", default-features = false }
# the established CLI style in this workspace, see shoal/examples/tmdb.rs
clap = { version = "4.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# every artifact this tool reads or writes is json
serde_json = "1"
# only used to find the storage path in shoal.yml. that path is what gets wiped between runs, so
# it is parsed rather than scraped with a regex the way bench.sh did it
serde_yaml = "0.9"
anyhow = "1"
# There is no date dependency here on purpose. `chrono` is not in the workspace lockfile, and
# `time` - which is - pulls `time-macros` in behind the `formatting` feature it would be needed
# for, which is not. The whole of what this tool wants from a date library is one civil-date
# conversion, so `src/clock.rs` does it in forty tested lines and the lockfile stays untouched.
# content hashes of the sources each measurement layer covers
sha2 = "0.10"
hex = "0.4"
# walking target/criterion and the source lists in docs/perf/sources.json
walkdir = "2.5"
# Charts. `default-features = false` is mandatory: the default set pulls chrono, ttf, image and
# bitmap_backend, none of which are in the lockfile. Every feature enabled here is dep-free
# except `svg_backend`, which pulls plotters-svg - already present via criterion's html_reports.
plotters = { version = "0.3.7", default-features = false, features = [
    "svg_backend",
    "line_series",
    "area_series",
    "point_series",
    "errorbar",
] }

# Everything below is the measured half, and is optional so the runner can be built without it.
# `shoal` is the facade the workloads drive; the rest is what driving a client needs.
shoal = { version = "0.1.0", path = "../shoal", optional = true }
# the facade does not re-export the config leaf types a workload has to name, such as `TraceLevel`
# and `Durability`. `shoal/examples/tmdb.rs` reaches past it the same way for `trace::setup`.
shoal-core = { version = "0.1.0", path = "../shoal-core", optional = true }
tokio = { workspace = true, optional = true }
kanal = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
hotpath = { workspace = true, optional = true }
# A schema writes its own rkyv and deepsize2 derives, and the workloads stamp their own uuids.
# `glommio` sat here too until F15, named by a path `#[shoal::db]` generated rather than by
# anything in this crate - which is what known issue 54 was.
deepsize2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# the server half of a workload runs on glommio, and the client half needs an allocator that
# matches the one the server was measured with
mimalloc = { workspace = true, optional = true }
# Shipping a run's measurements to a collector while the capture is still going (F34). Every one
# of these is already resolved through `shoal-core`, which pulls the same three at the same
# versions for the trace half - the metrics half of them is in each crate's *default* feature set,
# so this adds instruments to build and no packages to the lockfile. They sit in the measured half
# because the workload process is what has a measurement worth shipping; the runner never links
# them, and `cargo tree -p shoal-bench --no-default-features` is unchanged.
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", optional = true }
opentelemetry-otlp = { version = "0.28", optional = true }
# the tls transport arms generate a certificate per workload per run rather than committing one,
# so that nothing in the repository expires and invalidates a capture
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs", "pem"], optional = true }

# The stage layer against a live server. Feature gated the same way the report builder's own
# eight tests are, because it needs a build that records stages at all - and because it starts a
# server and drives it, which is not something a default `cargo test --workspace` should pay for.
[[test]]
name = "stage_join"
required-features = ["stage-profile"]

[dev-dependencies]
tempfile = "3"
