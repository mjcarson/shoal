[package]
name = "shoal-client"
version = "0.1.0"
edition = "2021"
description = "Shoal's async client."
license = "MIT"

[lib]
name = "shoal_client"
path = "src/lib.rs"

[features]
# record when a response came off the socket. must be enabled with the server's half or the two
# disagree about whether stamps exist at all
stage-profile = []
# enable hotpath profiling
#
# a build with this on is an attribution build - its absolute latencies are not comparable to a
# build without it, the same rule that already applies to the server's half. this exists
# separately from `shoal-core/hotpath` because the whole point of measuring the client is to be
# able to do it in a build that has no engine in it at all
hotpath = ["hotpath/hotpath"]

# tokio and a connection pool, and nothing that could start a database
[dependencies]
shoal-proto = { version = "0.1.0", path = "../shoal-proto" }
tokio = { workspace = true }
rkyv = { workspace = true }
uuid = { workspace = true }
kanal = { workspace = true }
bb8 = "0.8"
papaya = "0.2"
async-trait = "0.1"
tracing = "0.1"
# optional so that a client built without the feature does not link a profiler it never calls
hotpath = { workspace = true, optional = true }
futures = "0.3"
bytes = "1.5"
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws-lc-rs",
    "logging",
] }
rustls-pki-types = "1"

[dev-dependencies]
tempfile = "3"
