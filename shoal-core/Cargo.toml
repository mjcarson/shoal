[package]
name = "shoal-core"
version = "0.1.0"
edition = "2021"
description = "The core parts of Shoal. A batteries not included database."
license = "MIT"

[features]
default = ["server"]
# Enables the server features for Shoal
server = ["glommio"]
# enable hotpath profiling
hotpath = ["hotpath/hotpath"]
# Enables SHQL autocompletion support for clients. The parser it turns on lives in the protocol
# crate, so this only forwards - a server has no use for completion, but it is the same parser.
shql-complete = ["shoal-proto/shql-complete"]
# Re-exports crate private internals so the benches in shoal/benches can reach them.
# This is not a supported API and carries no stability promise.
bench = []
# record where each query spent its time, stage by stage
#
# a build with this on is an attribution build - its absolute latencies are not comparable
# to a build without it, the same rule that already applies to `hotpath`
stage-profile = []

[dependencies]
shoal-proto = { version = "0.1.0", path = "../shoal-proto" }
clap = { version = "4.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
config = "0.13" 
gxhash = "2.2"
rkyv = { workspace = true }
rkyv-with = "0.1"
glommio = { workspace = true, optional = true }
bytes = "1.5"
intmap = "2"
futures = "0.3"
kanal = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
papaya = "0.2"
byte-unit = { version = "5.1", features = ["serde"] }
deepsize2 = { workspace = true }
lru = "0.16"
bb8 = "0.8"
async-trait = "0.1"
hotpath = { workspace = true }

# tracing dependencies
opentelemetry = "0.28"
opentelemetry_sdk = "0.28"
opentelemetry-otlp = { version = "0.28" }
tracing = "0.1"
tracing-opentelemetry = "0.29"
tracing-subscriber = "0.3"
tonic = { version = "0.8.2", features = ["tls-roots"] }
opentelemetry-semantic-conventions = { version = "0.10.0" }
opentelemetry-proto = { version = "0.1.0"}
winnow = "0.7"
unicode-ident = "1"

# authentication dependencies
#
# these are the RustCrypto stack that `sha2 0.10` and `digest 0.10` are already in the tree for,
# so none of them widen the dependency graph by a generation. none of them are reachable from
# `shared::protocol`, which has to stay on `core` and `uuid` alone
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
rand = "0.8"
subtle = "2"

# encryption dependencies
#
# rustls performs the handshake and nothing else - once the keys are handed to the kernel it is
# out of the data path entirely, which is what keeps the response read copy free
# (F14). `aws-lc-rs` is the provider rather than `ring` because it is rustls' own default and
# because a userspace fallback, if one is ever needed, wants its AES-GCM assembly.
#
# note that `tonic`'s `tls-roots` already puts rustls 0.20 in the graph. two majors coexist, and
# nothing here is reachable from `shared::protocol`, which has to stay on `core` and `uuid`
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
