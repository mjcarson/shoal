[package]
name = "shoal-core"
version = "0.1.0"
edition = "2021"
description = "The core parts of Shoal. A batteries not included database."
license = "MIT"

[features]
default = ["server"]
# Enables the server features for Shoal
server = ["glommio"]
# enable hotpath profiling
hotpath = ["hotpath/hotpath"]
# Enables SHQL autocompletion support for clients
shql-complete = ["dep:nucleo-matcher"]
# Re-exports crate private internals so the benches in shoal/benches can reach them.
# This is not a supported API and carries no stability promise.
bench = []

[dependencies]
clap = { version = "4.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
config = "0.13" 
gxhash = "2.2"
rkyv = { workspace = true }
rkyv-with = "0.1"
glommio = { workspace = true, optional = true }
bytes = "1.5"
intmap = "2"
futures = "0.3"
kanal = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
papaya = "0.2"
byte-unit = { version = "5.1", features = ["serde"] }
deepsize2 = "0.1"
lru = "0.16"
bb8 = "0.8"
async-trait = "0.1"
hotpath = { workspace = true }

# tracing dependencies
opentelemetry = "0.28"
opentelemetry_sdk = "0.28"
opentelemetry-otlp = { version = "0.28" }
tracing = "0.1"
tracing-opentelemetry = "0.29"
tracing-subscriber = "0.3"
tonic = { version = "0.8.2", features = ["tls-roots"] }
opentelemetry-semantic-conventions = { version = "0.10.0" }
opentelemetry-proto = { version = "0.1.0"}
winnow = "0.7"
unicode-ident = "1"
nucleo-matcher = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
