[package]
name = "shoal-loadgen"
version = "0.1.0"
edition = "2024"
description = "Benchmark any Shoal schema against a dataset folder: the driver, the run plan and the results shoaladm bench is built on (F66)"
publish = false

# No engine. Everything here is a client of a schema it never names: it is generic over the
# client type `#[shoal::db]` emits, and the per-table pieces come from the table derives. The
# admin program a schema's project builds links it, so it must not reach glommio either:
# `cargo tree -p shoal-loadgen | grep -c glommio` is 0
[dependencies]
shoal = { path = "../shoal", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# the dataset readers, the latency histograms and the digests, at the versions the lockfile
# already resolves for the tmdb loader and shoaladm
csv = "1"
hdrhistogram = "7.5"
sha2 = "0.10"
# an object's bytes, handed to an endpoint without a copy (F94); in the lockfile through tokio's
# own users already
bytes = "1"
# the S3 endpoint (F94): an HTTP/1.1 client and SigV4's HMAC, at the versions the lockfile already
# resolves through opentelemetry-otlp and shoal-proto, with no feature that adds a package - no
# TLS, no HTTP/2, no streams. Off by default, so a schema's admin program never compiles them
reqwest = { version = "0.12.24", default-features = false, optional = true }
hmac = { version = "0.12", optional = true }

[features]
# the local store its tests and shoaladm's are run against listens on a port, which needs tokio's
# net and io-util, both in the lockfile already
s3 = ["dep:reqwest", "dep:hmac", "tokio/net", "tokio/io-util"]

[dev-dependencies]
# the S3 endpoint's tests answer it from a server of their own on a local port (F94)
tokio = { version = "1", features = ["net", "io-util"] }
# the test schema is declared the way a client half is, with the two derives a schema writes
deepsize2 = { workspace = true }
tempfile = "3"
