# X9's scratch configuration on titan (`docs/src/object-storage/table-latency.md`), copied to
# /var/tmp/x9/conf.yml by x9-lab.sh. Sized for the Zen1 hosts' four cores, whose SMT siblings are
# adjacent (cpus 0-1 are core 0, 2-3 core 1, 4-5 core 2, 6-7 core 3): cpu 0 is never a shard's,
# and excluding cores 0 and 3 puts the two shards on cpus 2 and 4, one a physical core. The client
# runs under `taskset -c 6,7`, the whole of core 3, and the arm with a core of its own puts the
# object work on cpu 1, core 0's other thread, beside a coordinator that runs nothing in a
# standalone node. Storage on the root ext4 of the 970 EVO, wiped before every run; tracing at
# Warn and no remote sink, as the lab's before-and-after procedure has it
resources:
  cores: 2
  exclude_cores: [0, 3]
  memory: "4Gi"
storage:
  default:
    filesystem:
      latency_sensitive:
        path: "/var/tmp/x9/shoal"
        buffer_size: 4096
      throughput_sensitive:
        path: "/var/tmp/x9/shoal"
tracing:
  level: Warn
