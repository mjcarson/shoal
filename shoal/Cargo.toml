[package]
name = "shoal"
version = "0.1.0"
edition = "2021"
description = "A batteries not included database."
license = "MIT"

[lib]
name = "shoal"
path = "src/lib.rs"

# This crate is a facade. It re-exports `shoal-core` and `shoal-derive` and holds no code of its
# own, so every feature here exists only to forward one.
[features]
default = ["server"]
# Link the engine.
#
# Off, this facade is a client and nothing else: no shard, no storage, no glommio, no io_uring.
# That is what `#[shoal::db(client)]` schemas build against, and what makes `shoalctl` a program
# that has never heard of a storage engine (F15).
server = ["dep:shoal-core"]
# enable hotpath profiling
#
# forwards to both halves, and — unlike before — does **not** imply `server`. The client is the
# layer this exists to attribute, and requiring an engine to profile it would mean the one build
# where the client is the whole of the code is the one build that cannot be measured. The
# `hotpath/hotpath` half went with `main`, which moved to `shoal-bench`'s workload binary when
# the benchmark harness left this crate.
hotpath = ["shoal-client/hotpath", "shoal-core?/hotpath"]
# expose shoal-core internals to the criterion benches in benches/
bench = ["server", "shoal-core/bench"]
# record where each query spent its time, stage by stage
#
# every crate holding a stamp has to agree about whether stamps exist, or the client's
# `ClientStamps` is zero sized while the server's `StageStamps` is not. The report that joins
# them is built in `shoal-bench`.
stage-profile = ["shoal-client/stage-profile", "shoal-core?/stage-profile"]
# SHQL autocompletion, which clients opt into
shql-complete = ["shoal-proto/shql-complete"]


[dependencies]
shoal-proto = { version = "0.1.0", path = "../shoal-proto" }
shoal-client = { version = "0.1.0", path = "../shoal-client" }
shoal-core = { version = "0.1.0", path = "../shoal-core", optional = true }
shoal-derive = { version = "0.1.0", path = "../shoal-derive" }
# The derive macros no longer name any crate the caller has to declare - they emit `::shoal::`
# paths and this facade re-exports what they reach for (F15, known issue 54). What is left here is
# what this crate's own tests, benches and examples write by hand: a schema declares its rkyv and
# deepsize2 derives itself, and the tests are async.
rkyv = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
deepsize2 = { workspace = true }

[dev-dependencies]
# the shql tests cover autocompletion, which clients opt into
shoal-core = { version = "0.1.0", path = "../shoal-core", features = ["shql-complete"] }
futures = "0.3"
# the example builds its config in code and stores it under a temp dir, so it needs no shoal.yml
tempfile = "3"
criterion = { workspace = true }
# the wire bench allocates a request body both of the ways the relay can, so it needs the same
# buffer type the relay uses rather than a stand-in for it
bytes = "1.5"
# the scram_credential example prints the yaml stanza a shoal.yml carries
serde_yaml = "0.9"
# the tls tests generate a certificate per run rather than committing one, so nothing expires
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
# `disk_lookups` counts the partition lookups a sorted table makes, and the only place the shipping
# code says it made one is the span `block_on_load` opens - so the test subscribes to those rather
# than adding a counter to the engine that only a test would ever read
tracing = "0.1"
tracing-subscriber = "0.3"

# the micro benchmarks reach crate private internals of shoal-core through its `bench`
# feature, so they cannot be built without it
[[bench]]
name = "partitions"
harness = false
required-features = ["bench"]

# unlike `partitions`, this reaches nothing crate private - the protocol module is public - so it
# builds and runs with no features at all, which is what somebody debugging a framing change
# wants. gating it would make a bare `cargo bench -p shoal` silently skip it
[[bench]]
name = "wire"
harness = false

# routing is public API too - `server::ring` and `ShardRouting` both are - so this needs no
# features either. It is the layer the query path had no benchmark of at all
[[bench]]
name = "routing"
harness = false
