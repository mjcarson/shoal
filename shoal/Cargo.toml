[package]
name = "shoal"
version = "0.1.0"
edition = "2021"
description = "A batteries not included database."
license = "MIT"

[lib]
name = "shoal"
path = "src/lib.rs"

[features]
# enable hotpath profiling
#
# this must forward to shoal-core, since every instrumentation attribute lives there and
# enabling only the hotpath crate's own feature builds a profiler with nothing to measure
hotpath = ["hotpath/hotpath", "shoal-core/hotpath"]
#hotpath-alloc = ["hotpath/hotpath-alloc"]
# expose shoal-core internals to the criterion benches in benches/
bench = ["shoal-core/bench"]


[dependencies]
shoal-core = { version = "0.1.0", path = "../shoal-core" }
shoal-derive = { version = "0.1.0", path = "../shoal-derive" }
rkyv = { workspace = true }
gxhash = { workspace = true }
uuid = { workspace = true }
glommio = { workspace = true }
tokio = { workspace = true }
owo-colors = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kanal = { workspace = true }
mimalloc = { workspace = true }
hotpath = { workspace = true }

[dev-dependencies]
# the shql tests cover autocompletion, which clients opt into
shoal-core = { version = "0.1.0", path = "../shoal-core", features = ["shql-complete"] }
clap = { version = "4.2", features = ["derive"] }
csv-async = { version = "1.3", features = ["tokio", "with_serde"] }
serde = "1.0.219"
futures = "0.3"
kanal = "0.1.0-pre8"
deepsize2 = "0.1"
core_affinity = "0.8"
tempfile = "3"
byte-unit = "5.1"
criterion = { workspace = true }

# the micro benchmarks reach crate private internals of shoal-core through its `bench`
# feature, so they cannot be built without it
[[bench]]
name = "partitions"
harness = false
required-features = ["bench"]
