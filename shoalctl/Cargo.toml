[package]
name = "shoalctl"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for querying a Shoal database, built for its schema on the fly"

[dependencies]
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30.0"
ratatui-hypertile = "0.2"
unicode-width = "0.2"
rkyv = "0.8"
# no engine. this is a terminal UI that opens a connection and sends queries - it has no shard,
# no storage and no reason to compile io_uring, which it did until F15
shoal = { path = "../shoal", default-features = false, features = ["shql-complete"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.11", features = ["v4"] }
# the command line, and the `--project`/`--db`/`-i` a schema's own program shares with shoaladm
clap = { version = "4.2", features = ["derive"] }

# the cluster tab's model, connecting to a deployed cluster as its admin, the user config that
# names a default inventory, and building this program for a schema from its project (F63).
# the admin half links no engine either, so neither does this
shoaladm = { version = "0.1.0", path = "../shoaladm" }

# a schema writes its own `#[derive(DeepSizeOf)]`, and the app really does use channels. glommio
# used to sit here too, purely because `#[shoal::db]` named it - see F15 and known issue 54
deepsize2 = { workspace = true }
kanal = { workspace = true }

[dev-dependencies]
# the tmdb example's tables read a csv with serde, as the F51 pair did
serde = { version = "1", features = ["derive"] }
