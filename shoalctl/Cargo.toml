[package]
name = "shoalctl"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30.0"
ratatui-hypertile = "0.2"
unicode-width = "0.2"
rkyv = "0.8"
# no engine. this is a terminal UI that opens a connection and sends queries - it has no shard,
# no storage and no reason to compile io_uring, which it did until F15
shoal = { path = "../shoal", default-features = false, features = ["shql-complete"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.11", features = ["v4"] }

# a schema writes its own `#[derive(DeepSizeOf)]`, and the app really does use channels. glommio
# used to sit here too, purely because `#[shoal::db]` named it - see F15 and known issue 54
deepsize2 = { workspace = true }
kanal = { workspace = true }

# maybe these should?
serde = { version = "1", features = ["derive"] }

# `shoalctl cluster` (F51): its command line, the inventory and the `shoal.yml` it renders, the
# leaf it issues each node, and the digest it checks a copied program against. every one is a
# version the lockfile already resolves for another crate, so the graph does not grow
clap = { version = "4.2", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
sha2 = "0.10"

[dev-dependencies]
# the pki test reads the leaf's der back the way the peer lanes do
rustls-pemfile = "2"
# the wizard test writes an inventory somewhere it can throw away
tempfile = "3"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
