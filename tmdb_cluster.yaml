# Written by `shoalctl cluster new`. Edit it by hand, or again with `cluster new --from <this file>`.
#
# Build the server program for the oldest cpu among the hosts, never native - a build for a newer
# one dies of SIGILL at its claim:
#
#   RUSTFLAGS="-C target-cpu=<oldest host's cpu>" cargo build --release --bin <your node program>
#
# then deploy it with:
#
#   <your shoalctl program> cluster bootstrap -i <this file>
name: tmdb
server: target/deploy/release/tmdb-dataset-node
ports:
  client: 12000
  peer: 12001
  control: 12002
replication_factor: 3
control_voters: 3
resources:
  cores: 6
  memory: 8Gi
  control_core_shared: false
groups:
  bd795i:
    storage:
      latency: /optane/shoal-tmdb
    wal_commit_delay: 3ms
    lead_weight: 2
  v1000:
    storage:
      latency: /optane/shoal
    wal_commit_delay: 2ms
tracing: Info
user: shoal
admin: admin
# a principal that may read every table and every bucket and write none, which the bootstrap
# seeds (F77, F79); `SHOAL_DEPLOY_USER=reader` connects a command as it
users: [reader]
grants:
  reader:
    tables:
      '*': [read]
    buckets:
      '*': [read]
# the storage pool objects are kept in, and the bucket the schema declares bound to it, which the
# bootstrap commits (F80): until a pool has devices (M14) every object is held inline, in its
# path's row, at or under the pool's threshold (16 KiB unless `inline` says otherwise)
pools:
  fast:
    class: ssd
    redundancy: {replicas: 3}
    failure_domain: host
buckets:
  Posters: {pool: fast}
nodes:
- name: europa
  address: 172.16.2.10
  group: bd795i
- name: titan
  group: v1000
- name: hyperion
  group: v1000
